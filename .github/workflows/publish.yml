name: Build, test and publish

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - name: Build wheel from source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match package version"
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Install and verify wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -I scripts/check_installed.py
          python -I -m unittest discover -s tester -p 'test_*.py' -v
      - name: Verify interactive extra
        run: |
          python -m pip install "$(echo dist/*.whl)[interaktiv]"
          python -m pip check
          python -I scripts/check_installed.py --interaktiv

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kthbygg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
