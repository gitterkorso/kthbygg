[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kthbygg"
version = "0.1.0"
description = "Python-bibliotek för dimensionering av bärverk enligt Eurokod (stål, trä, snölast)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Nick Westin", email="nickw@kth.se" }
]
license = { file="LICENSE" }
keywords = ["eurokod", "stål", "trä", "balk", "tvärsnittsklassning", "knäckning", "vippning", "konstruktion"]
dependencies = [
    "numpy",
    "sympy",
    "matplotlib",
    "ipython",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Swedish",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Interaktiva diagram i balk.rita_interaktiv(); nbformat behövs för att visa plotly i Jupyter
interaktiv = ["plotly", "nbformat"]

[project.urls]
Homepage = "https://github.com/gitterkorso/kthbygg"
Repository = "https://github.com/gitterkorso/kthbygg"
Documentation = "https://github.com/gitterkorso/kthbygg#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["kthbygg*"]